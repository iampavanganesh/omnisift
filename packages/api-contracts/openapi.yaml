      parameters:
        - name: productId
          required: false
          in: query
          schema:
            type: string
          description: Internal product UUID. Not schema-validated; omitting it returns an empty series list.
        - name: days
          required: false
          in: query
          schema:
            type: string
          description: 'Range in days. NOT validated: any value outside 30 | 90 | 180 | 365 | 1095 is silently clamped to 90 rather than rejected. meta.days reports what was actually applied.'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
