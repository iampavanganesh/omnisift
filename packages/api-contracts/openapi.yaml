info:
  title: Omnisift API
  description: Product Intelligence Platform — REST API
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - AUTHENTICATION_ERROR
        - AUTHORIZATION_ERROR
        - NOT_FOUND
        - PROVIDER_ERROR
        - DATABASE_ERROR
        - BUSINESS_RULE_ERROR
        - INTERNAL_ERROR
      description: Stable machine-readable code. Safe to branch on.
    ApiErrorDetailDto:
      type: object
      properties:
        code:
          description: Stable machine-readable code. Safe to branch on.
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Safe, user-facing message. Never contains a stack trace or internal detail.
      required:
        - code
        - message
    ApiErrorResponseDto:
      type: object
      properties:
        success:
          type: boolean
          example: false
          description: Always false on an error response.
        error:
          $ref: '#/components/schemas/ApiErrorDetailDto'
        requestId:
          type: string
          nullable: true
          description: Correlation id echoed from the x-request-id request header, or null.
      required:
        - success
        - error
        - requestId
    SessionResponseDto:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: number
      required:
        - userId
        - email
        - accessToken
        - refreshToken
        - expiresAt
    OkResultDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required:
        - ok
    ProductResponseDto:
      type: object
      properties:
        token:
          type: string
        productId:
          type: string
        title:
          type: string
        platform:
          type: string
        price:
          type: number
        oldPrice:
          type: number
          nullable: true
        currency:
          type: string
        imageUrl:
          type: string
        productUrl:
          type: string
        rating:
          type: number
          nullable: true
        reviewCount:
          type: number
          nullable: true
        delivery:
          type: string
        brand:
          type: string
        category:
          type: string
      required:
        - token
        - productId
        - title
        - platform
        - price
        - oldPrice
        - currency
        - imageUrl
        - productUrl
        - rating
        - reviewCount
        - delivery
        - brand
        - category
    SearchMetaDto:
      type: object
      properties:
        query:
          type: string
          description: The query string that was searched.
        page:
          type: number
          description: Zero-based page index that was served.
        count:
          type: number
          description: Number of products in `data` after any maxPrice filter.
        hasMore:
          type: boolean
          description: 'True only when another page may be requested: the page ceiling has not been reached AND this page returned results. Pagination is finite — see the `page` parameter.'
      required:
        - query
        - page
        - count
        - hasMore
    CategoryResponseDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        productCount:
          type: number
      required:
        - id
        - name
        - slug
        - productCount
    CountMetaDto:
      type: object
      properties:
        count:
          type: number
          description: Number of items in `data`.
      required:
        - count
    CategoryFacetValueDto:
      type: object
      properties:
        value:
          type: string
          description: One observed value for this spec key.
        count:
          type: number
          description: How many products in the category have this value.
      required:
        - value
        - count
    CategoryFacetDto:
      type: object
      properties:
        key:
          type: string
          description: Spec key, e.g. "RAM". Percent-encode when building `specs`.
        values:
          type: array
          items:
            $ref: '#/components/schemas/CategoryFacetValueDto'
      required:
        - key
        - values
    CategoryDetailResponseDto:
      type: object
      properties:
        category:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            slug:
              type: string
          required:
            - id
            - name
            - slug
        insights:
          type: object
          properties:
            productCount:
              type: number
            avgLowestPrice:
              type: number
              nullable: true
            topDiscountPct:
              type: number
              nullable: true
          required:
            - productCount
            - avgLowestPrice
            - topDiscountPct
        brandsInCategory:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              slug:
                type: string
              productCount:
                type: number
