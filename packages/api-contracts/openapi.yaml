      operationId: PriceHistoryController_history_v1
      parameters:
        - name: productId
          required: false
          in: query
          schema:
            type: string
          description: Internal product UUID. Not schema-validated; omitting it returns an empty list rather than an error.
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PricePointDto'
                  meta:
                    $ref: '#/components/schemas/CountMetaDto'
                required:
                  - success
                  - data
        '429':
          description: Rate limit exceeded (global ThrottlerGuard).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '500':
          description: INTERNAL_ERROR — unexpected failure; details are logged, never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      summary: Daily price snapshots for a product
      tags:
        - products
  /api/v1/products/price-graph:
