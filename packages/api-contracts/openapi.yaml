  /api/v1/affiliate/go/product/{productId}/seller/{sellerId}:
    get:
      description: 'Public (guest) — used by the public web product pages. SECURITY: takes PATH PARAMETERS ONLY and never accepts a destination URL. The destination is looked up from the stored ProductListing for this exact (product, seller) pair; if that pair has no listing the request 404s. There is deliberately no endpoint anywhere that will redirect to a caller-supplied address. Note: ids that are well-formed UUIDs but unknown return 404, while a MALFORMED id currently surfaces as 500 (the database driver rejects it before the lookup returns) — neither case ever emits a Location header.'
      operationId: AffiliateRedirectController_go_v1
      parameters:
        - name: productId
          required: true
          in: path
          description: Internal product UUID.
          schema:
            type: string
        - name: sellerId
          required: true
          in: path
          description: Internal seller UUID.
          schema:
            type: string
      responses:
        '302':
          description: 302 to the resolved seller listing URL, in the Location header. No response body.
        '404':
          description: NOT_FOUND — the requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '429':
          description: Rate limit exceeded (global ThrottlerGuard).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '500':
          description: INTERNAL_ERROR — unexpected failure; details are logged, never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      summary: Redirect to a seller listing, resolved server-side
      tags:
        - affiliate
  /api/v1/affiliate/go/product/{productId}/platform/{platform}:
    get:
      description: 'Public (guest) — used by the Flutter compare screens, whose comparison payload carries the provider `platform` string rather than an internal seller UUID. Same security model as the sellerId variant: path parameters only, destination resolved from the stored listing, 404 when the platform does not resolve to a real seller with a listing for this product. Only works for catalogued products. Note: a malformed productId surfaces as 500 rather than 404 (see the sellerId variant); no Location header is emitted either way.'
      operationId: AffiliateRedirectController_goByPlatform_v1
      parameters:
        - name: productId
          required: true
          in: path
          description: Internal product UUID.
          schema:
            type: string
        - name: platform
          required: true
          in: path
          description: Seller platform name, e.g. "Amazon". URL-encode it.
          schema:
            type: string
      responses:
        '302':
          description: 302 to the resolved seller listing URL, in the Location header. No response body.
        '404':
          description: NOT_FOUND — the requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '429':
          description: Rate limit exceeded (global ThrottlerGuard).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '500':
          description: INTERNAL_ERROR — unexpected failure; details are logged, never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      summary: Redirect to a seller listing, keyed by platform name
      tags:
        - affiliate
